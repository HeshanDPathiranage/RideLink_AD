# ===================================================================
# RideLink - Fare & Payment Microservice Configuration
# ===================================================================

# Server Configuration
server.port=8084
spring.application.name=fare-service

# MongoDB Atlas Connection Configuration
# (Database-Per-Service Pattern: Isolated database for Fare & Payment Service)
# Replace <username>, <password>, and <cluster-url> with your MongoDB Atlas credentials
# Alternatively, pass them via environment variables: MONGO_URI
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=ridelink_fare_db
spring.data.mongodb.auto-index-creation=true

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.fare_service=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
